<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rangrezz Admin — Control Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0E070B;
      --bg-elevated: #180D14;
      --bg-card: #20111B;
      --ivory: #F8ECE2;
      --ivory-dim: #BDAEA4;
      --gold: #D4A657;
      --gold-bright: #F5CA7B;
      --danger: #E85555;
      --line: rgba(245, 236, 226, 0.1);
      --line-gold: rgba(212, 166, 87, 0.3);
      --whatsapp: #25D366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background:
        radial-gradient(ellipse at 20% 0%, rgba(212,166,87,0.12), transparent 50%),
        radial-gradient(ellipse at 80% 40%, rgba(220,120,160,0.06), transparent 40%),
        var(--bg);
      color: var(--ivory);
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
      padding: 20px 14px 120px;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    /* Header */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 10px;
    }
    .brand-header h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 700;
      color: var(--ivory);
      letter-spacing: -0.02em;
    }
    .brand-header h1 span {
      color: var(--gold);
      font-style: italic;
    }
    .brand-subtitle {
      font-size: 13px;
      color: var(--ivory-dim);
      margin-top: 4px;
      font-weight: 500;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      justify-content: center;
      background: rgba(24, 13, 20, 0.8);
      border: 1px solid var(--line);
      padding: 5px;
      border-radius: 999px;
      max-width: 440px;
      margin: 0 auto 28px;
      backdrop-filter: blur(12px);
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--ivory-dim);
      padding: 12px 18px;
      border-radius: 999px;
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--gold);
      color: #0E070B;
      box-shadow: 0 4px 18px rgba(212, 166, 87, 0.3);
    }

    /* Section Views */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Main Glass Panels */
    .panel {
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    /* Form Controls */
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      font-weight: 700;
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--ivory);
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    select:focus, input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 166, 87, 0.15);
    }

    /* Drag & Drop Area */
    .dropzone {
      border: 2px dashed var(--line-gold);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      background: rgba(212, 166, 87, 0.02);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .dropzone:hover, .dropzone.dragover {
      background: rgba(212, 166, 87, 0.08);
      border-style: solid;
    }
    .dropzone-icon {
      font-size: 36px;
      margin-bottom: 8px;
      display: block;
    }
    .dropzone p {
      font-weight: 700;
      color: var(--ivory);
      font-size: 15px;
    }
    .dropzone span {
      font-size: 12px;
      color: var(--ivory-dim);
      display: block;
      margin-top: 4px;
    }

    /* Controls Bar in Manage Tab */
    .manage-toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .action-group {
      display: flex;
      gap: 10px;
    }

    .btn-pill {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ivory);
      padding: 9px 18px;
      border-radius: 999px;
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-pill:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .btn-pill-gold {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(212, 166, 87, 0.08);
    }
    .btn-pill-gold:hover {
      background: var(--gold);
      color: #0E070B;
    }

    .counter-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--ivory-dim);
    }

    /* Search Box */
    .search-wrap {
      position: relative;
      margin-bottom: 20px;
    }
    .search-wrap input {
      padding-left: 40px;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ivory-dim);
      font-size: 16px;
      pointer-events: none;
    }

    /* 🎯 UNIFORM BULLETPROOF CARD GRID SYSTEM */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      align-items: stretch;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .grid-container {
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
    }

    @media (max-width: 580px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px !important;
      }
      .panel { padding: 14px; border-radius: 16px; }
      body { padding-left: 10px; padding-right: 10px; }
    }

    /* Standardized Product & Upload Cards */
    .card-item {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      height: 100%;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    /* Delete Card Specific Interactive Styling */
    .delete-card {
      cursor: pointer;
    }
    .delete-card:hover {
      border-color: rgba(212, 166, 87, 0.4);
      transform: translateY(-2px);
    }
    .delete-card.selected {
      border-color: var(--danger) !important;
      box-shadow: 0 0 0 2px var(--danger);
      background: rgba(232, 85, 85, 0.08);
    }

    /* Bulletproof Uniform Aspect Ratio Box */
    .card-media {
      width: 100%;
      aspect-ratio: 3 / 4;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #140B11;
      flex-shrink: 0;
    }
    .card-media img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Overlays inside Image Box */
    .checkbox-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .delete-card.selected .checkbox-overlay {
      background: var(--danger);
      border-color: var(--danger);
    }
    .checkbox-overlay svg {
      width: 13px;
      height: 13px;
      stroke: #ffffff;
      stroke-width: 3.5;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .delete-card.selected .checkbox-overlay svg {
      opacity: 1;
    }

    .edit-pill-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      background: rgba(14, 7, 11, 0.85);
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(6px);
      font-family: 'Manrope', sans-serif;
    }
    .edit-pill-btn:hover {
      background: var(--gold);
      color: #0E070B;
    }

    .remove-pill-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      background: rgba(232, 85, 85, 0.95);
      color: #FFF;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Strictly Formatted Details Container */
    .card-body {
      padding: 8px 4px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      gap: 3px;
    }
    .card-category {
      font-size: 10px;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ivory);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }
    .card-price {
      font-size: 14px;
      font-weight: 800;
      color: var(--gold-bright);
      font-family: 'Fraunces', serif;
      margin-top: 2px;
    }

    /* Upload inputs inside preview card */
    .upload-inputs {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .upload-inputs input {
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    /* Upload Submit Button */
    .primary-btn {
      width: 100%;
      background: var(--whatsapp);
      color: #072212;
      border: none;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 22px;
      font-family: 'Manrope', sans-serif;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.25);
      transition: filter 0.2s ease;
    }
    .primary-btn:hover { filter: brightness(1.08); }
    .primary-btn:disabled { opacity: 0.5; cursor: wait; box-shadow: none; }

    /* Glassmorphic Floating Delete Bar */
    .batch-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(140%);
      background: rgba(24, 13, 20, 0.92);
      border: 1px solid var(--danger);
      padding: 12px 24px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.85);
      z-index: 900;
      backdrop-filter: blur(16px);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .batch-bar.show { transform: translateX(-50%) translateY(0); }
    .batch-bar-count { font-weight: 700; font-size: 14px; color: var(--ivory); }
    
    .batch-delete-btn {
      background: var(--danger);
      color: #FFF;
      border: none;
      padding: 10px 22px;
      border-radius: 999px;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    /* Edit Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(6px);
    }
    .modal-card {
      background: var(--bg-elevated);
      border: 1px solid var(--line-gold);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 12px 50px rgba(0,0,0,0.8);
    }
    .modal-card h3 {
      font-family: 'Fraunces', serif;
      color: var(--gold);
      margin-bottom: 18px;
      font-size: 20px;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    #statusMsg {
      margin-top: 16px;
      font-weight: 700;
      text-align: center;
      color: var(--gold);
      font-size: 14px;
    }

    /* Failed Card State */
    .card-failed {
      border-color: var(--danger) !important;
    }
    .fail-badge {
      background: var(--danger);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 4px;
      text-align: center;
      border-radius: 6px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

<!-- 🔒 SECRET PIN LOCK SCREEN -->
<div id="lockScreen" style="position: fixed; inset: 0; background: #0E070B; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px;">
  <h2 style="font-family: 'Fraunces', serif; color: #D4A657; font-size: 30px;">🔒 Admin Panel Locked</h2>
  <p style="color: #BDAEA4; font-size: 14px;">Secret PIN enter karke unlock karein</p>
  <input type="password" id="pinInput" placeholder="Enter PIN" style="max-width: 220px; text-align: center; font-size: 22px; letter-spacing: 6px; padding: 12px; border-radius: 12px; border: 1px solid rgba(245, 236, 226, 0.2); background: #20111B; color: #F8ECE2; outline: none;">
  <button onclick="checkPin()" style="background: #D4A657; color: #0E070B; border: none; padding: 12px 36px; font-weight: 800; border-radius: 999px; cursor: pointer; font-size: 15px; font-family: 'Manrope', sans-serif;">Unlock Panel</button>
  <div id="pinError" style="color: #E85555; font-weight: bold; font-size: 13px; height: 18px;"></div>
</div>

<div class="container">
  
  <div class="brand-header">
    <h1>Rangrezz <span>Admin Control</span></h1>
    <p class="brand-subtitle">Catalog Upload & Product Management Console</p>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('upload')">Upload Photos</button>
    <button class="tab-btn" onclick="switchTab('manage')">Manage & Delete</button>
  </div>

  <!-- VIEW 1: UPLOAD PHOTOS -->
  <div id="uploadSection" class="view-section active">
    <div class="panel">
      <div class="form-row">
        <div class="form-group">
          <label>Select Category</label>
          <select id="categorySelect">
            <option value="BLOUSE">BLOUSE</option>
            <option value="SAREE">SAREE</option>
            <option value="KURTI">KURTI</option>
            <option value="SINGLE KURTI">SINGLE KURTI</option>
            <option value="3 PIECE">3 PIECE</option>
            <option value="2 PIECE">2 PIECE</option>
            <option value="LEHENGA">LEHENGA</option>
            <option value="GOWN">GOWN</option>
          </select>
        </div>
        <div class="form-group">
          <label>Default Price (Optional ₹)</label>
          <input type="number" id="defaultPrice" placeholder="e.g. 250" oninput="applyDefaultPrice()">
        </div>
      </div>

      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <span class="dropzone-icon">📸</span>
        <p>Drag & Drop Photos Here or Click to Choose</p>
        <span>Original High Resolution (No Image Compression)</span>
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
      </div>

      <div class="grid-container" id="previewGrid"></div>

      <button class="primary-btn" id="uploadBtn" style="display:none" onclick="startBulkUpload()">Upload Selected Images</button>
      <div id="statusMsg"></div>
    </div>
  </div>

  <!-- VIEW 2: MANAGE & DELETE CATALOG -->
  <div id="manageSection" class="view-section">
    <div class="panel">
      <div class="manage-toolbar">
        <div class="action-group">
          <button class="btn-pill" id="selectAllBtn" onclick="toggleSelectAllDelete()">Select All</button>
          <button class="btn-pill btn-pill-gold" onclick="loadExistingProducts()">Refresh</button>
        </div>
        <div class="counter-badge" id="totalCountText">0 items loaded</div>
      </div>

      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="manageSearchInput" placeholder="Search by name, category, or price..." oninput="filterAndRenderExisting()">
      </div>

      <div class="grid-container" id="existingGrid">Loading items...</div>
      
      <div style="text-align: center; margin-top: 30px;">
        <button id="loadMoreAdminBtn" class="btn-pill btn-pill-gold" style="display: none; padding: 12px 30px; font-size: 14px;" onclick="loadMoreExistingProducts()">Load More Items</button>
      </div>
    </div>
  </div>

</div>

<!-- Floating Multi-Delete Bar -->
<div class="batch-bar" id="batchBar">
  <span class="batch-bar-count" id="batchCount">0 selected</span>
  <button class="batch-delete-btn" onclick="deleteSelectedProducts()">Delete Selected</button>
</div>

<!-- Edit Product Modal -->
<div class="modal-overlay" id="editModalOverlay">
  <div class="modal-card">
    <h3>Edit Product</h3>
    <input type="hidden" id="editId">
    <div class="form-group" style="margin-bottom: 14px;">
      <label>Name</label>
      <input type="text" id="editName" placeholder="Product name">
    </div>
    <div class="form-group" style="margin-bottom: 14px;">
      <label>Price (₹)</label>
      <input type="number" id="editPrice" placeholder="Price">
    </div>
    <div class="form-group" style="margin-bottom: 18px;">
      <label>Category</label>
      <select id="editCategory">
        <option value="BLOUSE">BLOUSE</option>
        <option value="SAREE">SAREE</option>
        <option value="KURTI">KURTI</option>
        <option value="SINGLE KURTI">SINGLE KURTI</option>
        <option value="3 PIECE">3 PIECE</option>
        <option value="2 PIECE">2 PIECE</option>
        <option value="LEHENGA">LEHENGA</option>
        <option value="GOWN">GOWN</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-pill" style="flex:1" onclick="closeEditModal()">Cancel</button>
      <button class="btn-pill btn-pill-gold" style="flex:1" id="editSaveBtn" onclick="saveEditProduct()">Save Changes</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, orderBy, limit, startAfter, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  function escapeHtml(val) {
    if (val === undefined || val === null) return '';
    return String(val)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* 🔑 SECRET PIN LOCK LOGIC */
  const ADMIN_PIN = "7860";

  window.checkPin = function() {
    const inputPin = document.getElementById('pinInput').value;
    const errDiv = document.getElementById('pinError');

    if (inputPin === ADMIN_PIN) {
      document.getElementById('lockScreen').style.display = 'none';
      sessionStorage.setItem('adminUnlocked', 'true');
    } else {
      errDiv.textContent = "❌ Galat PIN! Dobara try karein.";
    }
  };

  document.getElementById('pinInput')?.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') checkPin();
  });

  if (sessionStorage.getItem('adminUnlocked') === 'true') {
    document.getElementById('lockScreen').style.display = 'none';
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBKdlUqXFF2rK0yZChhuzQRgfL_Tan4wRM",
    authDomain: "rangrezz-catalog.firebaseapp.com",
    projectId: "rangrezz-catalog",
    storageBucket: "rangrezz-catalog.firebasestorage.app",
    messagingSenderId: "490614934526",
    appId: "1:490614934526:web:bdd039027821b363928eaf"
  };

  const IMGBB_API_KEY = "b7d9a58aed38c1614607cb42b26c2487";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let selectedFiles = [];
  let allUploadedProducts = [];
  let selectedDeleteIds = new Set();
  
  /* PAGINATION VARS */
  let lastVisibleDoc = null;
  let hasMoreProducts = true;
  let isFetching = false;
  const BATCH_SIZE = 20;

  /* TAB SWITCHING */
  window.switchTab = function(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));

    if (tab === 'upload') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('uploadSection').classList.add('active');
      document.getElementById('batchBar').classList.remove('show');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('manageSection').classList.add('active');
      if(allUploadedProducts.length === 0) loadExistingProducts();
    }
  };

  /* UPLOAD DRAG & DROP LOGIC */
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const previewGrid = document.getElementById('previewGrid');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusMsg = document.getElementById('statusMsg');

  ['dragenter', 'dragover'].forEach(eName => {
    dropzone.addEventListener(eName, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(eName => {
    dropzone.addEventListener(eName, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); });
  });

  dropzone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
  fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); fileInput.value = ''; });

  function handleFiles(files) {
    const defPrice = document.getElementById('defaultPrice').value || '';
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const cleanName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
      selectedFiles.push({ file, name: cleanName, price: defPrice, status: 'pending' });
    });
    renderPreviews();
  }

  window.applyDefaultPrice = function () {
    const p = document.getElementById('defaultPrice').value;
    selectedFiles.forEach(item => { if (item.status !== 'done') item.price = p; });
    renderPreviews();
  };

  function renderPreviews() {
    previewGrid.innerHTML = '';
    if (selectedFiles.length === 0) { uploadBtn.style.display = 'none'; return; }
    uploadBtn.style.display = 'block';

    selectedFiles.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'card-item' + (item.status === 'failed' ? ' card-failed' : '');
      const imgUrl = URL.createObjectURL(item.file);
      card.innerHTML = `
        <button class="remove-pill-btn" onclick="removeItem(${index})">×</button>
        ${item.status === 'failed' ? '<div class="fail-badge">⚠️ Upload fail</div>' : ''}
        <div class="card-media">
          <img src="${imgUrl}">
        </div>
        <div class="upload-inputs">
          <input type="text" value="${escapeHtml(item.name)}" placeholder="Name" onchange="updateName(${index}, this.value)">
          <input type="number" value="${escapeHtml(item.price)}" placeholder="Price (₹)" onchange="updatePrice(${index}, this.value)">
        </div>
      `;
      previewGrid.appendChild(card);
    });
  }

  window.removeItem = function (idx) { selectedFiles.splice(idx, 1); renderPreviews(); };
  window.updateName = function (idx, val) { selectedFiles[idx].name = val; };
  window.updatePrice = function (idx, val) { selectedFiles[idx].price = val; };

  window.startBulkUpload = async function () {
    const category = document.getElementById('categorySelect').value;
    const pending = selectedFiles.filter(f => f.status !== 'done');
    
    if (pending.some(f => !f.price || !f.name)) {
      alert("Sabhi photos ka Name aur Price bharna zaroori hai!");
      return;
    }

    uploadBtn.disabled = true;
    let done = 0;
    let failedCount = 0;
    const MAX_SIZE = 32 * 1024 * 1024;

    for (const item of pending) {
      statusMsg.textContent = `⚡ Uploading (${done + 1}/${pending.length}): ${item.name}...`;
      try {
        if (item.file.size > MAX_SIZE) {
          throw new Error('File 32MB se bada hai, imgbb accept nahi karega');
        }

        const formData = new FormData();
        const ext = item.file.name.includes('.') ? item.file.name.split('.').pop() : 'jpg';
        formData.append("image", item.file, `${item.name}.${ext}`);

        const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        }).then(res => res.json());

        if (imgbbRes.success) {
          await addDoc(collection(db, "products"), {
            name: item.name,
            category: category,
            price: parseInt(item.price) || 0,
            image: imgbbRes.data.display_url || imgbbRes.data.url,
            createdAt: new Date().toISOString()
          });
          item.status = 'done';
        } else {
          throw new Error(imgbbRes.error?.message || 'imgbb upload failed');
        }
      } catch (err) {
        console.error(err);
        item.status = 'failed';
        failedCount++;
      }
      done++;
    }

    selectedFiles = selectedFiles.filter(f => f.status !== 'done');

    if (failedCount > 0) {
      statusMsg.textContent = `⚠️ ${done - failedCount}/${done} upload hui, ${failedCount} fail ho gayi — marked photos dobara try karein.`;
    } else {
      statusMsg.textContent = `✅ Sabhi photos upload ho gayi!`;
    }
    renderPreviews();
    uploadBtn.disabled = false;
  };

  /* SAFE BATCHED FETCH LOGIC */
  window.loadExistingProducts = async function () {
    const grid = document.getElementById('existingGrid');
    const loadBtn = document.getElementById('loadMoreAdminBtn');
    grid.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:var(--ivory-dim); padding: 40px;'>Loading inventory...</p>";
    selectedDeleteIds.clear();
    updateBatchBar();
    allUploadedProducts = [];
    lastVisibleDoc = null;
    hasMoreProducts = true;

    try {
      const q = query(collection(db, "products"), orderBy("createdAt", "desc"), limit(BATCH_SIZE));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        hasMoreProducts = false;
      } else {
        lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
        if (snapshot.docs.length < BATCH_SIZE) hasMoreProducts = false;

        snapshot.forEach((docSnap) => {
          allUploadedProducts.push({ id: docSnap.id, ...docSnap.data() });
        });
      }

      document.getElementById('totalCountText').textContent = `${allUploadedProducts.length} items loaded`;
      loadBtn.style.display = hasMoreProducts ? 'inline-block' : 'none';
      filterAndRenderExisting();
    } catch(err) {
      console.error(err);
      grid.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:var(--danger); padding: 40px;'>Error loading catalog.</p>";
    }
  };

  window.loadMoreExistingProducts = async function () {
    if (!hasMoreProducts || isFetching || !lastVisibleDoc) return;
    isFetching = true;
    const loadBtn = document.getElementById('loadMoreAdminBtn');
    loadBtn.textContent = "Loading...";

    try {
      const q = query(collection(db, "products"), orderBy("createdAt", "desc"), startAfter(lastVisibleDoc), limit(BATCH_SIZE));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        hasMoreProducts = false;
      } else {
        lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
        if (snapshot.docs.length < BATCH_SIZE) hasMoreProducts = false;

        snapshot.forEach((docSnap) => {
          allUploadedProducts.push({ id: docSnap.id, ...docSnap.data() });
        });
      }

      document.getElementById('totalCountText').textContent = `${allUploadedProducts.length} items loaded`;
      filterAndRenderExisting();
    } catch (err) {
      console.error("Load More error:", err);
    } finally {
      isFetching = false;
      loadBtn.textContent = "Load More Items";
      loadBtn.style.display = hasMoreProducts ? 'inline-block' : 'none';
    }
  };

  window.filterAndRenderExisting = function() {
    const grid = document.getElementById('existingGrid');
    const searchVal = (document.getElementById('manageSearchInput')?.value || '').toLowerCase().trim();

    const filtered = allUploadedProducts.filter(item => {
      const matchName = (item.name || '').toLowerCase().includes(searchVal);
      const matchCat = (item.category || '').toLowerCase().includes(searchVal);
      const matchPrice = (item.price !== undefined && item.price !== null) ? item.price.toString().includes(searchVal) : false;
      return matchName || matchCat || matchPrice;
    });

    if (filtered.length === 0) {
      grid.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:var(--ivory-dim); padding: 40px;'>Koi product nahi mila.</p>";
      return;
    }

    grid.innerHTML = filtered.map(item => {
      const isSel = selectedDeleteIds.has(item.id);
      return `
        <div class="card-item delete-card ${isSel ? 'selected' : ''}" onclick="toggleDeleteSelect('${item.id}')">
          <div class="card-media">
            <div class="checkbox-overlay">
              <svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <button class="edit-pill-btn" onclick="event.stopPropagation(); openEditModal('${item.id}')">Edit</button>
            <img src="${escapeHtml(item.image)}" loading="lazy" alt="${escapeHtml(item.name)}">
          </div>
          <div class="card-body">
            <div class="card-category">${escapeHtml(item.category)}</div>
            <div class="card-title">${escapeHtml(item.name)}</div>
            <div class="card-price">₹${escapeHtml(item.price)}</div>
          </div>
        </div>
      `;
    }).join('');

    updateSelectAllButtonText(filtered);
  };

  window.toggleDeleteSelect = function(id) {
    if (selectedDeleteIds.has(id)) selectedDeleteIds.delete(id);
    else selectedDeleteIds.add(id);

    filterAndRenderExisting();
    updateBatchBar();
  };

  window.toggleSelectAllDelete = function() {
    const searchVal = (document.getElementById('manageSearchInput')?.value || '').toLowerCase().trim();
    const currentFiltered = allUploadedProducts.filter(item => {
      const matchName = (item.name || '').toLowerCase().includes(searchVal);
      const matchCat = (item.category || '').toLowerCase().includes(searchVal);
      const matchPrice = (item.price !== undefined && item.price !== null) ? item.price.toString().includes(searchVal) : false;
      return matchName || matchCat || matchPrice;
    });

    const allSelected = currentFiltered.length > 0 && currentFiltered.every(item => selectedDeleteIds.has(item.id));

    if (allSelected) {
      currentFiltered.forEach(item => selectedDeleteIds.delete(item.id));
    } else {
      currentFiltered.forEach(item => selectedDeleteIds.add(item.id));
    }

    filterAndRenderExisting();
    updateBatchBar();
  };

  function updateSelectAllButtonText(currentFiltered) {
    const btn = document.getElementById('selectAllBtn');
    if (!btn) return;
    const allSelected = currentFiltered.length > 0 && currentFiltered.every(item => selectedDeleteIds.has(item.id));
    btn.textContent = allSelected ? 'Deselect All' : 'Select All';
  }

  function updateBatchBar() {
    const bar = document.getElementById('batchBar');
    const count = document.getElementById('batchCount');
    if (selectedDeleteIds.size > 0) {
      count.textContent = `${selectedDeleteIds.size} item${selectedDeleteIds.size > 1 ? 's' : ''} selected`;
      bar.classList.add('show');
    } else {
      bar.classList.remove('show');
    }
  }

  /* EDIT PRODUCT */
  window.openEditModal = function (id) {
    const item = allUploadedProducts.find(p => p.id === id);
    if (!item) return;
    document.getElementById('editId').value = id;
    document.getElementById('editName').value = item.name || '';
    document.getElementById('editPrice').value = item.price || '';
    document.getElementById('editCategory').value = item.category || 'BLOUSE';
    document.getElementById('editModalOverlay').style.display = 'flex';
  };

  window.closeEditModal = function () {
    document.getElementById('editModalOverlay').style.display = 'none';
  };

  window.saveEditProduct = async function () {
    const id = document.getElementById('editId').value;
    const name = document.getElementById('editName').value.trim();
    const price = document.getElementById('editPrice').value;
    const category = document.getElementById('editCategory').value;

    if (!name || !price) {
      alert("Name aur Price bharna zaroori hai!");
      return;
    }

    const saveBtn = document.getElementById('editSaveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
      const updatedFields = { name, price: parseInt(price) || 0, category };
      await updateDoc(doc(db, "products", id), updatedFields);

      const idx = allUploadedProducts.findIndex(p => p.id === id);
      if (idx !== -1) allUploadedProducts[idx] = { ...allUploadedProducts[idx], ...updatedFields };

      closeEditModal();
      filterAndRenderExisting();
    } catch (err) {
      console.error("Edit error:", err);
      alert("Update fail ho gaya, dobara try karein.");
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';
    }
  };

  /* SAFE MULTI-DELETE WITH FIREBASE BATCH */
  window.deleteSelectedProducts = async function () {
    if (selectedDeleteIds.size === 0) return;

    const idsToDelete = Array.from(selectedDeleteIds);

    allUploadedProducts = allUploadedProducts.filter(p => !selectedDeleteIds.has(p.id));
    selectedDeleteIds.clear();
    updateBatchBar();
    filterAndRenderExisting();
    document.getElementById('totalCountText').textContent = `${allUploadedProducts.length} items loaded`;

    try {
      const batch = writeBatch(db);
      idsToDelete.forEach(id => {
        batch.delete(doc(db, "products", id));
      });
      await batch.commit();
    } catch (err) {
      console.error("Multi delete error:", err);
      loadExistingProducts();
    }
  };
</script>

</body>
</html>
